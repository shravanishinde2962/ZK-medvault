      async function calculateSHA256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await window.crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      }

      async function deriveKey(passphrase = 'zk-medvault-key-2026') {
        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey(
          'raw', enc.encode(passphrase), { name: 'PBKDF2' }, false, ['deriveKey']
        );
        return window.crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: enc.encode('zk-medvault-salt-9912'),
            iterations: 100000,
            hash: 'SHA-256'
          },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
      }

      async function encryptData(data) {
        const key = await deriveKey();
        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        const enc = new TextEncoder();
        const encoded = enc.encode(typeof data === 'string' ? data : JSON.stringify(data));
        const ciphertextBuffer = await window.crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded);
        const ciphertextBase64 = btoa(String.fromCharCode(...new Uint8Array(ciphertextBuffer)));
        const ivBase64 = btoa(String.fromCharCode(...Array.from(iv)));
        const hash = await calculateSHA256(ciphertextBase64);
        return {
          ciphertext: ciphertextBase64,
          iv: ivBase64,
          ipfsCID: `bafybeih${hash.slice(0, 32).toLowerCase()}medvault77`,
          integrityHash: `0x${hash}`,
          timestamp: new Date().toISOString()
        };
      }

      function generateCurvePoint(seed) {
        const hash = Array.from(seed).reduce((acc, char) => (acc * 31 + char.charCodeAt(0)) % 1000000007, 7);
        return [
          `0x${(hash * 1337).toString(16).padStart(64, '0').slice(-64)}`,
          `0x${(hash * 7331).toString(16).padStart(64, '0').slice(-64)}`
        ];
      }

      async function generateZKProof(circuitType, privateInputs, publicInputs) {
        const startTime = performance.now();
        let isSatisfied = false;
        let publicSignals = [];
        let circuitName = '';

        if (circuitType === 'VACCINE_STATUS') {
          circuitName = 'VaccinationVerificationCircuit.circom';
          const { vaccineCode, doses } = privateInputs;
          const { requiredVaccineCode, minRequiredDoses } = publicInputs;
          isSatisfied = (vaccineCode === requiredVaccineCode) && (Number(doses) >= Number(minRequiredDoses));
          publicSignals = [`reqCode:${requiredVaccineCode}`, `minDoses:${minRequiredDoses}`, `isVerified:${isSatisfied ? '1' : '0'}`];
        } else if (circuitType === 'METRIC_RANGE_CHECK') {
          circuitName = 'BiomarkerRangeProof.circom';
          const { metricValue } = privateInputs;
          const { minThreshold, maxThreshold, metricName } = publicInputs;
          const num = parseFloat(metricValue);
          isSatisfied = num >= parseFloat(minThreshold) && num <= parseFloat(maxThreshold);
          publicSignals = [`metric:${metricName}`, `min:${minThreshold}`, `max:${maxThreshold}`, `inRange:${isSatisfied ? '1' : '0'}`];
        } else if (circuitType === 'AGE_ELIGIBILITY') {
          circuitName = 'AgeBracketMembership.circom';
          const { birthYear } = privateInputs;
          const { minAge, maxAge, currentYear = 2026 } = publicInputs;
          const calculatedAge = currentYear - parseInt(birthYear);
          isSatisfied = calculatedAge >= parseInt(minAge) && calculatedAge <= parseInt(maxAge);
          publicSignals = [`studyWindow:[${minAge}-${maxAge}]`, `validAge:${isSatisfied ? '1' : '0'}`];
        } else if (circuitType === 'CLINICAL_TRIAL_CRITERIA') {
          circuitName = 'PharmaTrialEligibility.circom';
          const { hasCondition, isNonSmoker, biomarkerValue } = privateInputs;
          const { targetCondition, reqNonSmoker, maxBiomarker } = publicInputs;
          const conditionMatch = hasCondition === targetCondition;
          const smokeMatch = !reqNonSmoker || isNonSmoker === true;
          const bioMatch = !maxBiomarker || parseFloat(biomarkerValue) <= parseFloat(maxBiomarker);
          isSatisfied = conditionMatch && smokeMatch && bioMatch;
          publicSignals = [`trialCondition:${targetCondition}`, `reqNonSmoker:${reqNonSmoker ? '1' : '0'}`, `isEligible:${isSatisfied ? '1' : '0'}`];
        }

        await new Promise(r => setTimeout(r, 380));
        const provingTimeMs = Math.round(performance.now() - startTime);
        const rawSeed = `${circuitType}_${JSON.stringify(publicInputs)}_${isSatisfied}_${Date.now()}`;
        const proofHash = await calculateSHA256(rawSeed);

        return {
          pi_a: [generateCurvePoint(proofHash + '_a0')[0], generateCurvePoint(proofHash + '_a1')[1], '0x1'],
          pi_b: [
            [generateCurvePoint(proofHash + '_b00')[0], generateCurvePoint(proofHash + '_b01')[1]],
            [generateCurvePoint(proofHash + '_b10')[0], generateCurvePoint(proofHash + '_b11')[1]],
            ['0x1', '0x0']
          ],
          pi_c: [generateCurvePoint(proofHash + '_c0')[0], generateCurvePoint(proofHash + '_c1')[1], '0x1'],
          protocol: 'groth16',
          curve: 'bn254',
          circuit: circuitName,
          provingTimeMs,
          proofHash: `0x${proofHash.slice(0, 40)}`,
          publicSignals,
          isValid: isSatisfied
        };
      }

      async function verifyZKProof(proof) {
        const startTime = performance.now();
        await new Promise(r => setTimeout(r, 150));
        const passed = proof.pi_a && proof.pi_b && proof.pi_c && proof.isValid === true;
        return {

          circuit: proof.circuit,
          verificationTimeMs: Math.round(performance.now() - startTime),
          publicSignals: proof.publicSignals,
          verifiedAt: new Date().toISOString()
        };
      }

      async function analyzeSymptomsLocally({ primarySymptoms = [], durationDays = 1, painScale = 1, hasFever = false, feverTemp = 98.6, chestPain = false, difficultyBreathing = false, customNotes = '' }) {
        const startTime = performance.now();
        let riskScore = 0;
        let redFlags = [];
        let department = 'General Practice / Outpatient';
        let urgency = 'Low (Routine Care)';
        let potentialConditions = [];
        let actionPlan = [];

        if (chestPain) {
          riskScore += 45;
          redFlags.push('Acute Chest Discomfort (Cardiovascular Risk)');
          department = 'Emergency Medicine / Cardiology';
          urgency = 'CRITICAL (Immediate ER Consultation)';
        }
        if (difficultyBreathing) {
          riskScore += 40;
          redFlags.push('Respiratory Compromise / Dyspnea');
          department = 'Pulmonology / Emergency Care';
          urgency = 'CRITICAL (Immediate ER Consultation)';
        }
        if (hasFever && feverTemp >= 103) {
          riskScore += 25;
          redFlags.push(`High Grade Hyperthermia (${feverTemp}°F)`);
        } else if (hasFever && feverTemp >= 100.4) {
          riskScore += 15;
        }
        if (painScale >= 8) {
          riskScore += 25;
          redFlags.push(`Severe Pain Level (${painScale}/10)`);
        } else if (painScale >= 5) {
          riskScore += 12;
        }

        const symLower = primarySymptoms.map(s => s.toLowerCase());
        const match = t => symLower.some(s => s.includes(t)) || customNotes.toLowerCase().includes(t);

        if (match('cough') || match('wheezing')) {
          if (match('wheezing') || match('asthma')) {
            potentialConditions.push({ name: 'Acute Bronchospasm / Asthma Exacerbation', probability: '82%', specialist: 'Pulmonologist' });
            department = 'Pulmonology';
          } else {
            potentialConditions.push({ name: 'Viral Upper Respiratory Infection', probability: '74%', specialist: 'Primary Care' });
          }
        }
        if (match('headache') || match('migraine') || match('dizziness')) {
          potentialConditions.push({ name: 'Tension / Stress Cephalea', probability: '85%', specialist: 'General Physician' });
        }
        if (match('stomach') || match('nausea')) {
          potentialConditions.push({ name: 'Gastroenteritis / Acid Dyspepsia', probability: '70%', specialist: 'Gastroenterology' });
        }
        if (match('rash') || match('itch')) {
          potentialConditions.push({ name: 'Allergic Contact Dermatitis', probability: '78%', specialist: 'Dermatologist' });
        }
        if (potentialConditions.length === 0) {
          potentialConditions.push({ name: 'Nonspecific Symptom Cluster', probability: '60%', specialist: 'General Practitioner' });
        }

        let level = 'LOW';
        if (riskScore >= 70 || chestPain || difficultyBreathing) {
          level = 'CRITICAL';
          urgency = 'CRITICAL (Immediate ER Consultation)';
          actionPlan = ['Call emergency services (911/112) or proceed to the nearest emergency department immediately.', 'Keep your Emergency ZK-Pass QR code ready for EMT paramedics.'];
        } else if (riskScore >= 40) {
          level = 'MODERATE';
          urgency = 'Moderate (Schedule Clinic Visit within 24-48h)';
          actionPlan = [`Consult a specialist in ${department}.`, 'Hydrate, rest, and monitor body temperature twice daily.'];
        } else {
          level = 'MILD';
          urgency = 'Low (Supportive Self-Care)';
          actionPlan = ['Practice supportive home care: adequate hydration and rest.', 'Monitor symptoms over next 48 hours.'];
        }

        await new Promise(r => setTimeout(r, 450));
        const inferenceTimeMs = Math.round(performance.now() - startTime);
        const receiptHash = await calculateSHA256(`${JSON.stringify(symLower)}_${riskScore}_${level}_${Date.now()}`);

        return {
          riskScore: Math.min(100, Math.max(5, riskScore)),
          riskLevel: level,
          urgency,
          department,
          potentialConditions,
          redFlags,
          actionPlan,
          inferenceTimeMs,
          zkTriageReceipt: {
            receiptHash: `0x${receiptHash}`,
            timestamp: new Date().toISOString(),
            signature: `SIG_ZKML_${receiptHash.slice(0, 20)}...`
          }
        };
      }

            txHash: `0x${Math.random().toString(16).slice(2, 14)}...${Math.random().toString(16).slice(2, 8)}`,
            timestamp: new Date().toISOString(),
            status: 'CRITICAL_AUDIT_LOG'
          };
          setAuditLogs(prev => [newLog, ...prev]);
          addNotification('🚨 BREAK-GLASS PROTOCOL ACTIVATED', `${doctorName} triggered emergency access for trauma care.`, 'emergency');
        };

        const claimResearchBounty = (studyId) => {
          const study = studies.find(s => s.id === studyId);
          if (!study || study.claimed) return;
          setStudies(prev => prev.map(s => s.id === studyId ? { ...s, claimed: true, enrolledCount: s.enrolledCount + 1 } : s));
          setPatientProfile(prev => ({ ...prev, medTokens: prev.medTokens + study.rewardTokens }));
          setAuditLogs(prev => [
            {
              id: `LOG-${Date.now()}`,
              type: 'RESEARCH_BOUNTY_CLAIMED',
              title: 'Pharma ZK-Eligibility Proof Verified & Bounty Paid',
              actor: `Smart Contract Escrow (${study.escrowAddress})`,
              detail: `ZK-Proof successfully verified on-chain. Released +${study.rewardTokens} $MED reward to patient wallet.`,
              txHash: `0x${Math.random().toString(16).slice(2, 12)}...${Math.random().toString(16).slice(2, 6)}`,
              timestamp: new Date().toISOString(),
              status: 'TOKENS_TRANSFERRED'
            },
            ...prev
          ]);
          addNotification(`🎉 +${study.rewardTokens} $MED Tokens Earned!`, `Your ZK proof for "${study.title}" was verified without revealing private health files.`, 'success');
        };

        const createStudy = (newStudyData) => {
          const studyObj = {
            id: `STUDY-${Date.now().toString().slice(-3)}`,
            title: newStudyData.title,
            sponsor: newStudyData.sponsor || 'Astra BioLabs',
            category: newStudyData.category || 'Clinical Research',
            rewardTokens: Number(newStudyData.rewardTokens) || 120,
            targetParticipants: Number(newStudyData.targetParticipants) || 300,
            enrolledCount: 0,
            criteriaDescription: newStudyData.criteriaDescription || 'ZK criteria validation required.',
            claimed: false,
            escrowAddress: `0x${Math.random().toString(16).slice(2, 6)}...EscrowPool`
          };
          setStudies(prev => [studyObj, ...prev]);
          addNotification('Study Created & Escrow Funded', `Study "${studyObj.title}" is now accepting ZK proofs.`, 'success');
        };

        return (
          <VaultContext.Provider value={{
            currentRole, setCurrentRole,
            patientProfile, setPatientProfile,
            records, setRecords,
            timedGrants, studies,
            emergencyPrefs, setEmergencyPrefs,
            auditLogs, notifications,
            addNotification, addRecord,
            revokeDoctorAccess, triggerBreakGlass,
            claimResearchBounty, createStudy
          }}>
            {children}
          </VaultContext.Provider>
        );
      }

                    ) : (
                      <button
                        onClick={() => handleClaim(study)}
                        disabled={claimingId === study.id}
                        className="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold shadow-lg cursor-pointer disabled:opacity-50"
                      >
                        {claimingId === study.id ? 'Generating ZK Proof...' : `✨ Prove & Claim +${study.rewardTokens} $MED`}
                      </button>
                    )}
                  </div>
                </div>
              ))}
            </div>

            {showModal && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                <div className="w-full max-w-lg rounded-2xl bg-slate-900 border border-amber-500/40 p-6 shadow-2xl">
                  <div className="flex justify-between pb-3 border-b border-slate-800 mb-4">
                    <h3 className="text-base font-bold text-white">Post New Clinical Trial</h3>
                    <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-white cursor-pointer">✕</button>
                  </div>
                  <form onSubmit={handleCreate} className="space-y-4 text-xs">
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1">Study Title</label>
                      <input type="text" required value={title} onChange={e => setTitle(e.target.value)} className="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-slate-200" />
                    </div>
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1">Reward per Patient ($MED)</label>
                      <input type="number" value={reward} onChange={e => setReward(e.target.value)} className="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-slate-200" />
                    </div>
                    <div className="flex justify-end gap-2 pt-2">
                      <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 cursor-pointer">Cancel</button>
                      <button type="submit" className="px-5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold cursor-pointer">Deploy Trial</button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      // AUDIT LOGS VIEW
      function AuditLogsView() {
        const { auditLogs } = useVault();
        return (
          <div className="space-y-8 animate-in fade-in duration-300">
            <div className="p-6 rounded-2xl bg-gradient-to-r from-slate-900 via-slate-900 to-cyan-950/40 border border-slate-800 shadow-xl">
              <h1 className="text-2xl font-extrabold text-white tracking-tight">📜 Immutable Blockchain Audit Ledger</h1>
              <p className="text-sm text-slate-300 max-w-2xl mt-1">
                Every zero-knowledge proof verification, time-locked access grant, and break-glass emergency override is permanently anchored on-chain.
              </p>
            </div>

            <div className="glass-panel p-6 space-y-3">
              <h2 className="text-sm font-bold text-white mb-3">On-Chain Event Stream ({auditLogs.length} Records)</h2>
              {auditLogs.map(log => {
                const isBreak = log.type === 'EMERGENCY_BREAK_GLASS';
                return (
                  <div key={log.id} className={`p-4 rounded-xl border ${isBreak ? 'bg-rose-950/40 border-rose-500/50' : 'bg-slate-900/80 border-slate-800'}`}>
                    <div className="flex justify-between items-center mb-1">
                      <h3 className={`text-sm font-bold ${isBreak ? 'text-rose-300' : 'text-white'}`}>{log.title}</h3>
                      <span className="text-[10px] text-slate-400 font-mono">{new Date(log.timestamp).toLocaleTimeString()}</span>
                    </div>
                    <p className="text-xs text-slate-300 mb-2">{log.detail}</p>
                    <div className="flex justify-between text-[11px] font-mono text-slate-400 pt-2 border-t border-slate-800">
                      <span>Actor: {log.actor}</span>
                      <span className="text-cyan-400">Tx: {log.txHash}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      // ==========================================
      // 5. MAIN APP SHELL
      // ==========================================
      function AppContent() {
        const { currentRole, setCurrentRole, patientProfile, notifications } = useVault();
        const [activeTab, setActiveTab] = useState('vault');
        const [showNotifs, setShowNotifs] = useState(false);

        const navTabs = [
          { id: 'vault', label: 'Encrypted Vault', roleReq: 'patient' },
          { id: 'ai-symptom', label: 'On-Device AI', roleReq: 'patient' },
          { id: 'emergency-pass', label: 'Emergency ZK-Pass', roleReq: 'patient' },
          { id: 'doctor', label: 'Doctor Verifier', roleReq: 'doctor' },
          { id: 'paramedic', label: 'Paramedic Scanner', roleReq: 'paramedic' },
          { id: 'research', label: 'Research Rewards', roleReq: 'pharma' },
          { id: 'audit', label: 'Audit Ledger', roleReq: 'all' }
        ];

        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
            {/* Top Navbar */}
            <header className="sticky top-0 z-50 border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-xl">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 text-white font-extrabold shadow-lg shadow-cyan-500/20">
                    ZK
                  </div>
                  <div>
                    <span className="font-bold text-lg text-white">ZK-MedVault</span>
                    <span className="text-xs text-slate-400 block hidden sm:block">Zero-Knowledge Medical Protocol</span>
                  </div>
                </div>

                {/* Role Switcher */}
                <div className="flex items-center gap-1 p-1 bg-slate-900 rounded-xl border border-slate-800 text-xs">
                  {['patient', 'doctor', 'paramedic', 'pharma'].map(r => (
                    <button
                      key={r}
                      onClick={() => {
                        setCurrentRole(r);
                        if (r === 'patient') setActiveTab('vault');
                        if (r === 'doctor') setActiveTab('doctor');
                        if (r === 'paramedic') setActiveTab('paramedic');
                        if (r === 'pharma') setActiveTab('research');
                      }}
                      className={`px-3 py-1.5 rounded-lg capitalize font-medium transition-all cursor-pointer ${
                        currentRole === r ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold shadow' : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      {r}
                    </button>
                  ))}
                </div>

                {/* Wallet & Alerts */}
                <div className="flex items-center gap-3">
                  <div className="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-xs font-mono font-bold text-amber-300">
                    {patientProfile.medTokens.toFixed(2)} $MED
                  </div>
                  <button
                    onClick={() => setShowNotifs(!showNotifs)}
                    className="relative p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white cursor-pointer"
                  >
                    🔔
                    {notifications.length > 0 && (
                      <span className="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-rose-500 text-[10px] font-bold text-white flex items-center justify-center">
                        {notifications.length}
                      </span>
                    )}
                  </button>
                </div>
              </div>
            </header>

            {/* Feature Tabs */}
            <div className="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-16 z-40">
              <div className="max-w-7xl mx-auto px-4 flex items-center gap-2 overflow-x-auto py-2.5">
                {navTabs.map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer ${
                      activeTab === tab.id ? 'bg-slate-800 text-cyan-400 border border-cyan-500/40 shadow-sm' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Main View Container */}
            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
              {activeTab === 'vault' && <PatientVaultView />}
              {activeTab === 'ai-symptom' && <AISymptomCheckerView />}
              {activeTab === 'emergency-pass' && <EmergencyPassView setActiveTab={setActiveTab} />}
              {activeTab === 'doctor' && <DoctorPortalView />}
              {activeTab === 'paramedic' && <ParamedicScannerView />}
              {activeTab === 'research' && <ResearchMarketplaceView />}
              {activeTab === 'audit' && <AuditLogsView />}
            </main>

            <footer className="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
              ZK-MedVault Protocol • Zero-Knowledge Groth16 • AES-GCM-256 WebCrypto • On-Device AI
            </footer>
          </div>
        );
      }

      function App() {
        return (
          <VaultProvider>
            <AppContent />
          </VaultProvider>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
